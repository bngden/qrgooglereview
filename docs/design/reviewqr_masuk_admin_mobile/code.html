</head><body class="bg-surface font-body-md text-on-surface flex flex-col min-h-screen"><header class="fixed top-0 inset-x-0 z-50 bg-surface/80 backdrop-blur-xl pt-safe"><div class="h-14 px-gutter flex items-center justify-between"><div class="flex items-center gap-space-sm"><button class="w-10 h-10 flex items-center justify-center text-on-surface -ml-2" onclick="history.back()"><span class="material-symbols-outlined text-[20px]">arrow_back_ios_new</span></button><span class="font-headline-xs text-on-surface tracking-tight">Incident Details</span></div><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></header><main class="flex flex-col relative w-full px-gutter pt-14 pb-space-2xl bg-surface flex-grow"><div class="flex flex-col w-full max-w-sm mx-auto justify-center py-space-xl flex-grow">
<!-- Brand & Logo Section -->
<div class="flex flex-col items-center mb-space-2xl">
<div class="w-16 h-16 rounded-2xl bg-primary flex items-center justify-center shadow-lg shadow-blue-500/20 mb-space-md">
<span class="material-symbols-outlined text-on-primary text-[32px]">admin_panel_settings</span>
</div>
<h1 class="font-headline-lg text-on-surface text-center tracking-tight mb-space-xs">Admin Portal</h1>
<p class="font-body-md text-on-surface-variant text-center">Silakan masuk untuk mengelola sistem</p>
</div>
<!-- Locked Variant Warning Banner -->
<div class="w-full bg-danger-bg text-danger p-space-md rounded-xl mb-space-lg flex items-start gap-space-md shadow-sm">
<span class="material-symbols-outlined text-[20px] mt-0.5">lock</span>
<div class="flex flex-col">
<span class="font-headline-xs text-danger mb-0.5">Akun Terkunci Sementara</span>
<span class="font-body-sm text-danger/90">Terlalu banyak percobaan. Coba lagi dalam 15 menit.</span>
</div>
</div>
<!-- Main Login Form Container -->
<div class="w-full bg-surface-container-lowest p-space-xl rounded-2xl shadow-xl shadow-blue-900/5 mb-space-lg">
<!-- Error Variant Message Banner -->
<div class="w-full bg-danger-bg text-danger px-space-md py-space-sm rounded-xl mb-space-lg flex items-center gap-space-sm">
<span class="material-symbols-outlined text-[18px]">error</span>
<span class="font-body-sm text-danger font-medium">Email atau kata sandi salah.</span>
</div>
<form class="flex flex-col gap-space-lg" onsubmit="event.preventDefault();">
<!-- Email Field -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-on-surface" for="email">Email</label>
<div class="relative flex items-center">
<span class="absolute left-3.5 material-symbols-outlined text-outline text-[20px]">mail</span>
<input class="w-full h-12 pl-11 pr-space-md rounded-[10px] bg-surface text-on-surface font-body-md focus:outline-none focus:ring-2 focus:ring-blue-600 transition-all placeholder:text-outline" id="email" placeholder="nama@perusahaan.co.id" type="email" value="admin.security@enterprise.co.id"/>
</div>
</div>
<!-- Kata Sandi Field -->
<div class="flex flex-col gap-space-xs">
<div class="flex justify-between items-center">
<label class="font-label-md text-on-surface" for="password">Kata sandi</label>
<a class="font-label-sm text-primary hover:underline" href="#">Lupa sandi?</a>
</div>
<div class="relative flex items-center">
<span class="absolute left-3.5 material-symbols-outlined text-outline text-[20px]">lock</span>
<input class="w-full h-12 pl-11 pr-11 rounded-[10px] bg-surface text-on-surface font-body-md focus:outline-none focus:ring-2 focus:ring-blue-600 transition-all" id="password" placeholder="Masukkan kata sandi" type="password" value="supersecurepassword123"/>
<button class="absolute right-3.5 text-outline hover:text-on-surface flex items-center justify-center" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined text-[20px]" id="eye-icon">visibility_off</span>
</button>
</div>
</div>
<!-- Submit Button -->
<button class="w-full h-12 rounded-[10px] bg-blue-600 hover:bg-blue-700 text-on-primary font-label-md transition-colors flex items-center justify-center gap-space-sm shadow-md shadow-blue-600/20 mt-space-sm" type="submit">
<span>Masuk</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
</div>
<!-- Footer Navigation Link -->
<div class="flex justify-center mt-space-md">
<a class="inline-flex items-center gap-space-xs font-label-md text-slate-600 hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined text-[16px]">arrow_back</span>
<span>Kembali ke beranda</span>
</a>
</div>
<!-- Simple Toggle Password Script for Delightful Polish -->
<script>
    function togglePassword() {
      const pwdInput = document.getElementById('password');
      const eyeIcon = document.getElementById('eye-icon');
      if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        eyeIcon.textContent = 'visibility';
      } else {
        pwdInput.type = 'password';
        eyeIcon.textContent = 'visibility_off';
      }
    }
  </script>
</div></main></body></html>
